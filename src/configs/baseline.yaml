defaults:
  - model: baseline
  - writer: wandb
  - metrics: example
  - datasets: onebatchtest
  - dataloader: example
  - transforms: example_only_instance
  - _self_
optimizer:
  _target_: torch.optim.AdamW
  lr: 3e-4
lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 1e-2
  pct_start: 0.1
  steps_per_epoch: ${trainer.epoch_len}
  epochs: ${trainer.n_epochs}
  anneal_strategy: cos
loss_function:
  _target_: src.loss.CTCLossWrapper
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
dataloader:
  batch_size: 2
trainer:
  log_step: 50
  n_epochs: 50
  epoch_len: 20
  device_tensors: ["spectrogram", "text_encoded"]
  resume_from: null
  device: auto
  override: True
  monitor: "min val_WER_(Argmax)"
  save_period: 50
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 1
writer:
  run_name: "onebatchtest_mlp"
  mode: "offline"
